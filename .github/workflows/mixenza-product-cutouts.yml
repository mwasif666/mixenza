name: Mixenza Hero Product Cutouts
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mixenza-product-cutouts.yml
permissions:
  contents: write
jobs:
  prepare-cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/mixenza-product-cutouts.yml
      - name: Install background removal
        run: pip install --disable-pip-version-check --quiet "rembg[cpu]==2.0.67" "Pillow>=10,<12"
      - name: Remove original product photo backgrounds
        env:
          U2NET_HOME: /home/runner/.u2net
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageFilter
          from rembg import remove, new_session
          sources = [
            "mist-hair-brush.png",
          ]
          target = Path("public/images/mixenza/cutouts")
          target.mkdir(parents=True, exist_ok=True)
          session = new_session("u2net")
          for filename in sources:
            src = Path("public/images/pickora") / filename
            assert src.exists() and src.stat().st_size > 10000, f"Missing original {src}"
            original = Image.open(src).convert("RGB")
            out = remove(original, session=session, alpha_matting=True, alpha_matting_foreground_threshold=245, alpha_matting_background_threshold=10, alpha_matting_erode_size=6)
            out = out.convert("RGBA")
            a = out.getchannel("A")
            a = a.point(lambda v: 0 if v < 22 else v)
            out.putalpha(a)
            bbox = out.getchannel("A").getbbox()
            assert bbox, f"No foreground subject from {src}"
            assert bbox[2] - bbox[0] > 120 and bbox[3] - bbox[1] > 120, f"Unexpected foreground size for {src}: {bbox}"
            out = out.crop(bbox)
            padding = max(18, int(max(out.size)*.045))
            canvas = Image.new("RGBA", (out.width + 2*padding,out.height + 2*padding),(255,255,255,0))
            canvas.alpha_composite(out,(padding,padding))
            if max(canvas.size)>1600:
              canvas.thumbnail((1600,1600),Image.Resampling.LANCZOS)
            dest = target / (src.stem+".png")
            canvas.save(dest,format="PNG",optimize=True)
            corners=[canvas.getpixel((x,y))[3] for x,y in [(0,0),(canvas.width-1,0),(0,canvas.height-1),(canvas.width-1,canvas.height-1)]]
            assert max(corners)==0, f"Transparent corners expected for {dest}"
            print(f"{src} => {dest} ({canvas.width}x{canvas.height}) with transparent background")
          PY
      - name: Commit processed images to public assets
        run: |
          git config user.name "Mixenza Image Processing"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/mixenza/cutouts/
          if git diff --cached --quiet; then
            echo "Processed images already current"
            exit 0
          fi
          git commit -m "Add transparent cutout of Mixenza mist hair brush"
          git pull --rebase origin main
          git push origin HEAD:main
